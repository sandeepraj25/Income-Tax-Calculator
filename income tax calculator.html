<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: url('https://img.freepik.com/premium-photo/road-damage_42082-87.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5); /* overlay for readability */
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    header h1 {
      margin-bottom: 30px;
      color: #2d3436;
      font-size: 28px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #2d3436;
      font-weight: 500;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 25px;
      transition: border 0.3s ease;
    }

    input:focus {
      border-color: #0984e3;
      outline: none;
    }

    button {
      width: 100%;
      background: #0984e3;
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #74b9ff;
      transform: translateY(-2px);
    }

    section {
      margin-top: 30px;
      background: #f1f2f6;
      padding: 20px;
      border-radius: 8px;
    }

    section h2 {
      color: #2d3436;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Income Tax Calculator</h1>
    </header>
    
    <form id="tax-form">
      <label for="income">Annual Income (₹)</label>
      <input type="number" id="income" name="income" placeholder="Enter your income" required>
      <button type="submit" id="calculate">Calculate Tax</button>
    </form>

    <section id="result">
      <h2>Tax Payable: ₹<span id="tax-amount">0</span></h2>
    </section>
    
  </main>

  <script src="income tax calculator.js"></script>
</body>
</html>
